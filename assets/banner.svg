<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">Coffee Shop Sales Analytics</title>
  <desc id="d">Banner: Coffee Shop Sales Analytics, an Excel and Power BI sales report covering 149,116 transactions across three New York City stores from January to June 2023.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B1B14"/>
      <stop offset="55%" stop-color="#3C2719"/>
      <stop offset="100%" stop-color="#55361F"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C98A4B"/>
      <stop offset="100%" stop-color="#C98A4B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <g opacity="0.07" fill="none" stroke="#F6F1EA" stroke-width="1.5">
    <circle cx="1120" cy="110" r="150"/>
    <circle cx="1120" cy="110" r="106"/>
    <circle cx="1120" cy="110" r="62"/>
  </g>
  <g opacity="0.13" stroke="#C98A4B" stroke-width="2" fill="none" stroke-linecap="round">
    <polyline points="860,330 920,300 980,312 1040,246 1100,214 1160,176 1220,140"/>
  </g>

  <text x="72" y="104" font-size="13" fill="#C98A4B" font-weight="600" letter-spacing="3.2">MAVEN ROASTERS · NEW YORK CITY</text>
  <text x="1208" y="104" font-size="13" fill="#A8917C" text-anchor="end" letter-spacing="1.2">EXCEL · POWER BI · DAX</text>
  <text x="72" y="176" font-size="56" fill="#F6F1EA" font-weight="700">Coffee Shop Sales Analytics</text>
  <text x="72" y="220" font-size="20" fill="#D4C0AC">Sales performance reporting for a three-store coffee retailer — a two-page Power BI</text>
  <text x="72" y="248" font-size="20" fill="#D4C0AC">report built on 149,116 point-of-sale transactions from the first half of 2023.</text>

  <rect x="72" y="276" width="420" height="3" rx="1.5" fill="url(#rule)"/>

  <g>
    <rect x="72" y="300" width="222" height="74" rx="10" fill="#F6F1EA" fill-opacity="0.07" stroke="#F6F1EA" stroke-opacity="0.16"/>
    <text x="92" y="334" font-size="25" fill="#F6F1EA" font-weight="700">149,116</text>
    <text x="92" y="357" font-size="12" fill="#BCA48E" letter-spacing="1.3">TRANSACTIONS</text>

    <rect x="312" y="300" width="222" height="74" rx="10" fill="#F6F1EA" fill-opacity="0.07" stroke="#F6F1EA" stroke-opacity="0.16"/>
    <text x="332" y="334" font-size="25" fill="#F6F1EA" font-weight="700">$698,812</text>
    <text x="332" y="357" font-size="12" fill="#BCA48E" letter-spacing="1.3">REVENUE, H1 2023</text>

    <rect x="552" y="300" width="222" height="74" rx="10" fill="#F6F1EA" fill-opacity="0.07" stroke="#F6F1EA" stroke-opacity="0.16"/>
    <text x="572" y="334" font-size="25" fill="#F6F1EA" font-weight="700">3 stores</text>
    <text x="572" y="357" font-size="12" fill="#BCA48E" letter-spacing="1.3">NEW YORK CITY</text>

    <rect x="792" y="300" width="222" height="74" rx="10" fill="#F6F1EA" fill-opacity="0.07" stroke="#F6F1EA" stroke-opacity="0.16"/>
    <text x="812" y="334" font-size="25" fill="#F6F1EA" font-weight="700">+104%</text>
    <text x="812" y="357" font-size="12" fill="#BCA48E" letter-spacing="1.3">REVENUE, JAN TO JUN</text>
  </g>

</svg>
