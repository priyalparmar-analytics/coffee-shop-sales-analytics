<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">How the report is built</title>
  <desc id="d">Four stages: the raw transaction sheet, the Excel modelling layer that adds revenue and price tier, the Power BI model with its calculated columns and measures, and the two report pages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#83817c"/>
    </marker>
  </defs>

  <rect width="1080" height="560" rx="12" fill="#fcfcfb"/>
  <rect x="0.5" y="0.5" width="1079" height="559" rx="12" fill="none" stroke="#dcd9d3"/>

  <text x="40" y="46" font-size="20" font-weight="600" fill="#0b0b0b">How the report is built</text>
  <text x="40" y="70" font-size="13" fill="#52514e">From the raw transaction sheet to the two published pages</text>

  <!-- 1 source -->
  <rect x="40" y="96" width="1000" height="84" rx="10" fill="#F6F1EA" stroke="#E0D3C4"/>
  <text x="62" y="124" font-size="11" font-weight="700" fill="#8A6A4B" letter-spacing="1.4">1 · SOURCE DATA</text>
  <text x="62" y="150" font-size="15" font-weight="600" fill="#0b0b0b">coffee-shop-sales.xlsx — sheet "Raw Data"</text>
  <text x="62" y="170" font-size="12.5" fill="#52514e">149,116 point-of-sale transactions · 13 columns · 3 stores · 80 products · 1 Jan – 30 Jun 2023</text>

  <line x1="540" y1="180" x2="540" y2="206" stroke="#83817c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2 excel -->
  <rect x="40" y="208" width="1000" height="124" rx="10" fill="#fcfcfb" stroke="#dcd9d3"/>
  <text x="62" y="236" font-size="11" font-weight="700" fill="#1D7044" letter-spacing="1.4">2 · MODELLING IN EXCEL</text>
  <rect x="62" y="248" width="310" height="68" rx="8" fill="#F1F7F3" stroke="#CFE4D8"/>
  <text x="80" y="272" font-size="13" font-weight="600" fill="#0b0b0b">Derived columns</text>
  <text x="80" y="292" font-size="11.5" fill="#52514e">revenue = qty × unit_price</text>
  <text x="80" y="308" font-size="11.5" fill="#52514e">price_tier = XLOOKUP(product_id)</text>

  <rect x="386" y="248" width="310" height="68" rx="8" fill="#F1F7F3" stroke="#CFE4D8"/>
  <text x="404" y="272" font-size="13" font-weight="600" fill="#0b0b0b">PivotTable summaries</text>
  <text x="404" y="292" font-size="11.5" fill="#52514e">revenue by month, store, category,</text>
  <text x="404" y="308" font-size="11.5" fill="#52514e">product type and price tier</text>

  <rect x="710" y="248" width="310" height="68" rx="8" fill="#F1F7F3" stroke="#CFE4D8"/>
  <text x="728" y="272" font-size="13" font-weight="600" fill="#0b0b0b">Q3 forecast</text>
  <text x="728" y="292" font-size="11.5" fill="#52514e">FORECAST.ETS on the monthly series</text>
  <text x="728" y="308" font-size="11.5" fill="#52514e">with 95% confidence bounds</text>

  <line x1="540" y1="332" x2="540" y2="358" stroke="#83817c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 power bi model -->
  <rect x="40" y="360" width="1000" height="104" rx="10" fill="#fcfcfb" stroke="#dcd9d3"/>
  <text x="62" y="388" font-size="11" font-weight="700" fill="#B07A10" letter-spacing="1.4">3 · POWER BI MODEL</text>
  <rect x="62" y="400" width="472" height="48" rx="8" fill="#FBF4E6" stroke="#EDDCBC"/>
  <text x="80" y="420" font-size="12.5" font-weight="600" fill="#0b0b0b">Calculated columns</text>
  <text x="80" y="438" font-size="11.5" fill="#52514e">Month Start · Month_Year · Hour of Day · Day Name</text>

  <rect x="548" y="400" width="472" height="48" rx="8" fill="#FBF4E6" stroke="#EDDCBC"/>
  <text x="566" y="420" font-size="12.5" font-weight="600" fill="#0b0b0b">Measures (DAX)</text>
  <text x="566" y="438" font-size="11.5" fill="#52514e">Total Revenue · Total Transactions · Avg Order Value · Best Month</text>

  <line x1="540" y1="464" x2="540" y2="490" stroke="#83817c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 4 report -->
  <rect x="40" y="492" width="1000" height="48" rx="10" fill="#EEF4FD" stroke="#CFE0F7"/>
  <text x="62" y="514" font-size="12.5" font-weight="700" fill="#1F5FB0" letter-spacing="1.2">4 · REPORT</text>
  <text x="148" y="514" font-size="12.5" fill="#0b0b0b">Page 1 · Sales Analysis — KPI cards, revenue trend with forecast, store comparison</text>
  <text x="148" y="532" font-size="12.5" fill="#0b0b0b">Page 2 · Deep Dive Analysis — slicers, product type, price tier, category mix, hour × weekday demand</text>
</svg>
